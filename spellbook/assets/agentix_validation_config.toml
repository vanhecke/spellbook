#
# demisto-sdk validate configuration for packs carrying Agentix content
# (AgentixAgents, AgentixActions, AgentixSkills, Knowledge).
#
# The SDK's own default_config.toml selects no AG rule, so without this file
# validate never looks at an agent, action or skill. Its sdk_validation_config
# does select them, but it is written for a checkout of demisto/content and
# pulls in validators that abort outside one.
#
# How spellbook uses this file (pack_builder.validate_pack):
#   - [path_based_validations] select is the list of AG rules to run.
#     pack_builder.agentix_validations() reads the AG codes from it and adds
#     them to the -sv list. That is necessary because -sv replaces a config's
#     select, so demisto-sdk itself never reads the list below. Only AG codes
#     are taken; every other code comes from SDK_SELECTED_VALIDATIONS.
#   - ignorable_errors is passed with --config-path, so a .pack-ignore entry
#     can silence the codes listed. It is copied from demisto-sdk 1.39.13's
#     default_config.toml, plus AG112 and AG117, which the SDK itself treats
#     as ignorable.
#
# Not selected:
#   AG100  forbidden-content list, resolved against the remote content repo
#   AG102  category, checked against approved_categories.json fetched remotely
#   AG112  action and skill character budgets
#   AG116  agent to action/skill dependencies, needs the content graph
#
# AG118 (every action needs an <ActionId>_test.yml beside it) is selected from
# demisto-sdk 1.39.13 onwards; it did not exist in 1.39.5. DO104 is not
# needed here any more: spellbook checks it natively (check_docker_images),
# with prompt scripts exempt.
#
# Refresh alongside the SDK pin in pyproject.toml.

ignorable_errors = [
  "AG112",
  "AG117",
  "BA101",
  "BA105",
  "BA106",
  "BA116",
  "BA118",
  "DO104",
  "IN108",
  "IN130",
  "PA107",
  "PA108",
  "PA111",
  "PA115",
  "PA128",
  "PA130",
  "RP101"
]

[path_based_validations]
select = [
  "AG101",
  "AG103",
  "AG104",
  "AG105",
  "AG106",
  "AG107",
  "AG108",
  "AG109",
  "AG110",
  "AG111",
  "AG114",
  "AG115",
  "AG117",
  "AG118"
]
warning = []
